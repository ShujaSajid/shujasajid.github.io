name: Integration tests

# NOTE (personal site): run manually only. The integration scripts below validate the
# upstream starter's demo content (blog posts, distill post, toggles), which this site
# no longer ships after cleanup. Kept for reference; run via "Run workflow" if needed.
on:
  workflow_dispatch:

jobs:
  comments-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps 📦
        run: npm ci

      # NOTE (personal site): the upstream starter style-contract check is intentionally not run here.
      # It forbids `_sass/`/`_includes/`/`_layouts/` overrides, but those are the documented way to
      # customize your own site (see docs/CUSTOMIZE.md and docs/ARCHITECTURE.md "local overrides").
      # This site centers the navbar via `assets/css/main.scss` + `_sass/_navbar-center.scss`,
      # tracked in `.al-folio-overrides.yml`. That check only applies to contributions to al-folio itself.

      - name: Install build prerequisites 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert

      - name: Run comments integration test 🧪
        run: bash test/integration_comments.sh

      - name: Run plugin toggle integration test 🔌
        run: bash test/integration_plugin_toggles.sh

      - name: Run distill integration test 📄
        run: bash test/integration_distill.sh

      - name: Run bootstrap compatibility integration test 🧩
        run: bash test/integration_bootstrap_compat.sh

      - name: Run upgrade CLI integration test ⬆️
        run: bash test/integration_upgrade_cli.sh

      - name: Run CSS minify integration test 🎨
        run: bash test/integration_css_minify.sh

      - name: Run new plugin integration checks 🧩
        run: bash test/integration_new_plugins.sh
